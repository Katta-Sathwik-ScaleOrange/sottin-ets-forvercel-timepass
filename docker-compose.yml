version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: tt_postgres_v1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tellapur_transit
    ports:
      - "5433:5432"
    volumes:
      - tt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tellapur_transit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-v1:
    image: redis:alpine
    container_name: tt_redis_v1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  typesense:
    image: typesense/typesense:0.25.1
    container_name: tt_typesense_v1
    restart: always
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=tt-local-typesense-key-2026
    ports:
      - "8108:8108"
    volumes:
      - tt_typesense_data:/data

volumes:
  tt_postgres_data:
  tt_typesense_data:
