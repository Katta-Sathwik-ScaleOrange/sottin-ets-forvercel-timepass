version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: tt_postgres_v1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tellapur_transit
    ports:
      - "5433:5432"
    volumes:
      - tt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tellapur_transit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: tt_redis_v1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tt_postgres_data:
