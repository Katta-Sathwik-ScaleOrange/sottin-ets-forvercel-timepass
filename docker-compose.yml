version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: tt_db_v1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tellapur_transit
    ports:
      - "5433:5432"
    volumes:
      - tt_db_data_v1:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: tt_redis_v1
    ports:
      - "6380:6379"

volumes:
  tt_db_data_v1:
